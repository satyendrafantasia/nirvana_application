spring:
  application:
    name: application
  # No profile is active by default. Select one explicitly (for example
  # SPRING_PROFILES_ACTIVE=local-spa for the local preview).

  datasource:
    url: ${SPA_DB_URL}
    username: ${SPA_DB_USER}
    password: ${SPA_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080
  # Client-supplied X-Forwarded-* headers are ignored unless this is set. Behind a
  # trusted reverse proxy or load balancer, set FORWARD_HEADERS_STRATEGY=native.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-none} correlationId=%X{correlationId:-none} userId=%X{userId:-anonymous}] "
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
      base-path: /management
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

# API documentation is off unless API_DOCS_ENABLED=true (the local-spa profile turns it on).
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui/index.html

# Search engines and link previews (docs/monitoring-and-seo.md). PUBLIC_SITE_URL is the approved
# HTTPS origin; unset keeps every page noindex, robots.txt closed and the sitemap empty.
# SEO_APP_SHELL is the built frontend/dist/app.html that spa pages are rendered into.
seo:
  public-origin: ${PUBLIC_SITE_URL:}
  app-shell: ${SEO_APP_SHELL:}

# Error reporting is off unless SENTRY_DSN is set (the starter reads it from the environment).
# SENTRY_ENVIRONMENT and SENTRY_RELEASE tag events the same way. Errors only: tracing already
# goes to OTLP above. No personal data, bodies or headers are sent (see config/SentryScrubbing).
sentry:
  send-default-pii: false
  max-request-body-size: none
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

multipart:
  max-file-size: 10MB
  max-request-size: 20MB

google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}
    base-url: https://maps.googleapis.com/maps/api/place

maps:
  provider: ${MAP_PROVIDER:google}
  google:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    base-url: https://maps.googleapis.com
    static-style: roadmap
  mapbox:
    api-key: ${MAPBOX_ACCESS_TOKEN:}
    base-url: https://api.mapbox.com
    static-style: streets-v11

aws:
  # Prefer using IAM roles or environment-based credentials in production instead of static keys.
  region: ap-south-1
  credentials:
    accessKeyId: ${AWS_ACCESS_KEY_ID:}
    secretAccessKey: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket-name: your-bucket-name
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}

flyway:
  enabled: true
  locations: "classpath:db/migration"

otp:
  length: 6
  expiryMinutes: 10
  maxAttempts: 5

sms:
  enabled: true
  # AWS_SNS, TWOFACTOR (2Factor.in) or FIREBASE (Google texts and checks the code in the browser;
  # needs the firebase settings below). Spa booking alerts use AWS SNS only.
  provider: ${SMS_PROVIDER:AWS_SNS}
  twofactor:
    api-key: ${TWOFACTOR_API_KEY:}
    # Name of an approved OTP template in the 2Factor dashboard; empty uses 2Factor's default template.
    otp-template: ${TWOFACTOR_OTP_TEMPLATE:}
  # DLT template ID for the OTP text "Your OTP is {#var#}. It is valid for {#var#} minutes."
  # The sender ID and entity ID are the business-wide ones under spa-alerts.sms.
  otp-template-id: ${SMS_TEMPLATE_OTP:}

# Firebase web app settings (Project settings > General > Your apps). Only used with sms.provider FIREBASE.
firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  web-api-key: ${FIREBASE_WEB_API_KEY:}
  auth-domain: ${FIREBASE_AUTH_DOMAIN:}

email:
  enabled: true
  provider: AWS_SES
  fromAddress: "no-reply@yourdomain.com"
  fromName: "YourAppName"

payments:
  razorpay:
    enabled: ${RAZORPAY_ENABLED:false}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    currency: INR
    auto-capture: true             # payment_capture = 1
    description-prefix: "Nirvana Spa Booking"

# Spa payouts: what Nirvana owes each spa for online money, settled weekly. MANUAL (the default) writes
# statements and an admin records the bank transfer; RAZORPAY_ROUTE also transfers through Razorpay Route
# (needs payments.razorpay keys, and Route with direct transfers enabled on the Razorpay account).
payouts:
  provider: ${PAYOUTS_PROVIDER:MANUAL}
  hold-days: ${PAYOUTS_HOLD_DAYS:2}
  since: ${PAYOUTS_SINCE:}
  zone: ${PAYOUTS_ZONE:Asia/Kolkata}
  cron: ${PAYOUTS_CRON:0 30 3 * * MON}

notifications:
  sendgrid:
    enabled: false
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:no-reply@nirvana.local}
    from-name: ${SENDGRID_FROM_NAME:Nirvana}
    owner-fallback-email: ${SPA_OWNER_EMAIL:}
    owner-subject: "New booking confirmed"
    customer-subject: "Your booking is confirmed"

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 1440
    refresh-expiration-days: 30
    device-fingerprint-header: X-Device-Fingerprint
  mfa:
    enabled: false
    header: X-MFA-Token
    bypass-token: ${MFA_BYPASS_TOKEN:}
  registration:
    # The unverified /api/auth/register endpoint. Keep false in production.
    legacy-enabled: ${LEGACY_REGISTRATION_ENABLED:false}

  oauth2:
    client:
      registration:
        google:
          client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
          client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
          redirect-uri: "{baseUrl}/oauth2/callback/google"
          scope: email,profile
        apple:
          client-id: ${APPLE_OAUTH_CLIENT_ID:}
          client-secret: ${APPLE_OAUTH_CLIENT_SECRET:}
          redirect-uri: "{baseUrl}/oauth2/callback/apple"
          scope: name,email
        facebook:
          client-id: ${FACEBOOK_OAUTH_CLIENT_ID:}
          client-secret: ${FACEBOOK_OAUTH_CLIENT_SECRET:}
          redirect-uri: "{baseUrl}/oauth2/callback/facebook"
          scope: public_profile,email
      provider:
        apple:
          authorization-uri: https://appleid.apple.com/auth/authorize
          token-uri: https://appleid.apple.com/auth/token
          user-info-uri: https://appleid.apple.com/auth/userinfo
          user-name-attribute: email
        facebook:
          authorization-uri: https://www.facebook.com/v18.0/dialog/oauth
          token-uri: https://graph.facebook.com/v18.0/oauth/access_token
          user-info-uri: https://graph.facebook.com/me?fields=id,name,email,first_name,last_name
          user-name-attribute: id


reliability:
  rate-limiting:
    enabled: true
    requests: 120
    auth-requests: ${RATE_LIMIT_AUTH_REQUESTS:20}
    captcha-bypass-token: ${RATE_LIMIT_BYPASS_TOKEN:}
  bookings:
    # An unpaid online booking is cancelled and its slot released after this long.
    pending-payment-expiry-minutes: ${BOOKING_PAYMENT_EXPIRY_MINUTES:30}
    expiry-interval-ms: 60000
    # The spa can check a guest in from this long before the start time.
    arrival-window-minutes: 120
    # Appointments the spa never closed out are marked completed this long after they end. 0 disables.
    auto-complete-after-hours: ${BOOKING_AUTO_COMPLETE_HOURS:24}
    auto-complete-interval-ms: 900000
    # Customers get one reminder this long before a confirmed appointment. 0 disables.
    reminder-lead-hours: ${BOOKING_REMINDER_LEAD_HOURS:24}
    reminder-interval-ms: 300000
  payments:
    reconcile-threshold-minutes: 15
    reconcile-interval-ms: 300000
    per-user-requests: 90
    window-seconds: 60
    block-seconds: 120

loyalty:
  # Points are earned on what was actually paid for a completed appointment (online, at the desk
  # or by gift card), credited on completion and taken back if that money is refunded.
  # 0 switches earning off.
  points-per-100-rupees: ${LOYALTY_POINTS_PER_100_RUPEES:1}
  # What one point is worth at checkout, in paise.
  point-value-paise: ${LOYALTY_POINT_VALUE_PAISE:100}
  # Points can pay for at most this share of a booking (after coupon and off-peak discounts).
  max-redeem-percent: ${LOYALTY_MAX_REDEEM_PERCENT:20}
  # Unspent points expire this many months after they were earned.
  expiry-months: ${LOYALTY_EXPIRY_MONTHS:12}
  job-interval-ms: ${LOYALTY_JOB_INTERVAL_MS:3600000}

referral:
  # POINTS gives both people points; COUPON gives each a single-use flat coupon of coupon-value-paise.
  reward-type: ${REFERRAL_REWARD_TYPE:POINTS}
  referrer-points: ${REFERRAL_REFERRER_POINTS:100}
  referee-points: ${REFERRAL_REFEREE_POINTS:100}
  coupon-value-paise: ${REFERRAL_COUPON_VALUE_PAISE:10000}
  coupon-valid-days: ${REFERRAL_COUPON_VALID_DAYS:90}
  # A referrer is rewarded for at most this many friends per calendar month (India time).
  monthly-cap: ${REFERRAL_MONTHLY_CAP:5}
  # A code can be added only within this many days of opening the account, before a completed booking.
  claim-window-days: ${REFERRAL_CLAIM_WINDOW_DAYS:30}

gift-cards:
  min-paise: ${GIFT_CARD_MIN_PAISE:50000}
  # RBI caps a gift PPI at Rs 10,000.
  max-paise: ${GIFT_CARD_MAX_PAISE:1000000}
  # RBI requires gift instruments to stay valid for at least a year; lower values are raised to 365.
  validity-days: ${GIFT_CARD_VALIDITY_DAYS:365}

# Booking SMS to spas, with a private link to confirm or decline. Uses the sms settings above
# (AWS SNS). Indian carriers need a DLT-registered sender and one template per message kind.
spa-alerts:
  enabled: ${SPA_ALERTS_ENABLED:true}
  interval-ms: 120000
  log-messages: false
  sms:
    sender-id: ${SPA_SMS_SENDER_ID:}
    dlt-entity-id: ${SPA_SMS_DLT_ENTITY_ID:}
    templates:
      new: ${SPA_SMS_TEMPLATE_NEW:}
      reminder: ${SPA_SMS_TEMPLATE_REMINDER:}
      cancelled: ${SPA_SMS_TEMPLATE_CANCELLED:}
      moved: ${SPA_SMS_TEMPLATE_MOVED:}
  # SMS, or WHATSAPP to send alerts with Meta's WhatsApp Cloud API (SMS stays the fallback).
  channel: ${SPA_ALERTS_CHANNEL:SMS}
  whatsapp:
    phone-number-id: ${SPA_WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${SPA_WHATSAPP_ACCESS_TOKEN:}
    api-version: ${SPA_WHATSAPP_API_VERSION:v23.0}
    language: ${SPA_WHATSAPP_LANGUAGE:en}
    # Names of the approved templates in WhatsApp Manager.
    templates:
      new: ${SPA_WHATSAPP_TEMPLATE_NEW:nirvana_spa_booking_new}
      reminder: ${SPA_WHATSAPP_TEMPLATE_REMINDER:nirvana_spa_booking_reminder}
      cancelled: ${SPA_WHATSAPP_TEMPLATE_CANCELLED:nirvana_spa_booking_cancelled}
      moved: ${SPA_WHATSAPP_TEMPLATE_MOVED:nirvana_spa_booking_moved}

# Booking updates to guests on WhatsApp, for guests who agreed to them. Uses the WhatsApp number set
# up under spa-alerts.whatsapp; email updates continue as before.
guest-alerts:
  whatsapp:
    enabled: ${GUEST_WHATSAPP_ENABLED:false}
    templates:
      confirmed: ${GUEST_WHATSAPP_TEMPLATE_CONFIRMED:nirvana_guest_booking_confirmed}
      reminder: ${GUEST_WHATSAPP_TEMPLATE_REMINDER:nirvana_guest_booking_reminder}
      moved: ${GUEST_WHATSAPP_TEMPLATE_MOVED:nirvana_guest_booking_moved}
      cancelled: ${GUEST_WHATSAPP_TEMPLATE_CANCELLED:nirvana_guest_booking_cancelled}

# GST documents. The spa issues the guest's invoice (marketplace model); Nirvana invoices the spa
# for its commission.
gst:
  # SAC for a spa treatment unless the service sets its own: 999722, beauty and physical well-being.
  default-sac: ${GST_DEFAULT_SAC:999722}
  # Used only when a spa has no tax_percent; a service's gst_rate_pct overrides both.
  default-rate-pct: ${GST_DEFAULT_RATE_PCT:18}
  nirvana:
    legal-name: ${NIRVANA_LEGAL_NAME:Nirvana Wellness Private Limited}
    # Needed to issue commission invoices; its first two digits are Nirvana's state.
    gstin: ${NIRVANA_GSTIN:}
    address: ${NIRVANA_REGISTERED_ADDRESS:}
  commission:
    sac: ${GST_COMMISSION_SAC:998599}
    rate-pct: ${GST_COMMISSION_RATE_PCT:18}
  sweep:
    # Issues missed invoices and credit notes for this many days back, and last month's commission
    # invoices. 0 turns the sweep off.
    lookback-days: ${GST_SWEEP_LOOKBACK_DAYS:45}
    initial-delay-ms: 300000
    interval-ms: 600000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  scheduling:
    # Background jobs: payment reconciliation, unpaid-booking expiry, auto-completion.
    enabled: ${SCHEDULING_ENABLED:true}
  health-forms:
    # Guest health answers are encrypted with AES-256-GCM. Base64 of 32 random bytes; without it the form is off.
    encryption-key: ${HEALTH_FORM_KEY:}
    # Answers are deleted this many days after the visit (at once for a cancelled booking).
    retention-days: ${HEALTH_FORM_RETENTION_DAYS:90}
  flyway:
    # Flyway repair rewrites migration history. Run it deliberately, never on every start.
    repair-on-migrate: ${FLYWAY_REPAIR_ON_MIGRATE:false}
