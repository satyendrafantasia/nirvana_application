spring:
  application:
    name: application
  # No profile is active by default. Select one explicitly (for example
  # SPRING_PROFILES_ACTIVE=local-spa for the local preview).

  datasource:
    url: ${SPA_DB_URL}
    username: ${SPA_DB_USER}
    password: ${SPA_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080
  # Client-supplied X-Forwarded-* headers are ignored unless this is set. Behind a
  # trusted reverse proxy or load balancer, set FORWARD_HEADERS_STRATEGY=native.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
      base-path: /management
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

# API documentation is off unless API_DOCS_ENABLED=true (the local-spa profile turns it on).
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui/index.html

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

multipart:
  max-file-size: 10MB
  max-request-size: 20MB

google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}
    base-url: https://maps.googleapis.com/maps/api/place

maps:
  provider: ${MAP_PROVIDER:google}
  google:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    base-url: https://maps.googleapis.com
    static-style: roadmap
  mapbox:
    api-key: ${MAPBOX_ACCESS_TOKEN:}
    base-url: https://api.mapbox.com
    static-style: streets-v11

aws:
  # Prefer using IAM roles or environment-based credentials in production instead of static keys.
  region: ap-south-1
  credentials:
    accessKeyId: ${AWS_ACCESS_KEY_ID:}
    secretAccessKey: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket-name: your-bucket-name
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}

flyway:
  enabled: true
  locations: "classpath:db/migration"

otp:
  length: 6
  expiryMinutes: 10
  maxAttempts: 5

sms:
  enabled: true
  provider: AWS_SNS

email:
  enabled: true
  provider: AWS_SES
  fromAddress: "no-reply@yourdomain.com"
  fromName: "YourAppName"

payments:
  razorpay:
    enabled: ${RAZORPAY_ENABLED:false}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    currency: INR
    auto-capture: true             # payment_capture = 1
    description-prefix: "Nirvana Spa Booking"

notifications:
  sendgrid:
    enabled: false
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:no-reply@nirvana.local}
    from-name: ${SENDGRID_FROM_NAME:Nirvana}
    owner-fallback-email: ${SPA_OWNER_EMAIL:}
    owner-subject: "New booking confirmed"
    customer-subject: "Your booking is confirmed"

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 1440
    refresh-expiration-days: 30
    device-fingerprint-header: X-Device-Fingerprint
  mfa:
    enabled: false
    header: X-MFA-Token
    bypass-token: ${MFA_BYPASS_TOKEN:}
  registration:
    # The unverified /api/auth/register endpoint. Keep false in production.
    legacy-enabled: ${LEGACY_REGISTRATION_ENABLED:false}

  oauth2:
    client:
      registration:
        google:
          client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
          client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
          redirect-uri: "{baseUrl}/oauth2/callback/google"
          scope: email,profile
        apple:
          client-id: ${APPLE_OAUTH_CLIENT_ID:}
          client-secret: ${APPLE_OAUTH_CLIENT_SECRET:}
          redirect-uri: "{baseUrl}/oauth2/callback/apple"
          scope: name,email
        facebook:
          client-id: ${FACEBOOK_OAUTH_CLIENT_ID:}
          client-secret: ${FACEBOOK_OAUTH_CLIENT_SECRET:}
          redirect-uri: "{baseUrl}/oauth2/callback/facebook"
          scope: public_profile,email
      provider:
        apple:
          authorization-uri: https://appleid.apple.com/auth/authorize
          token-uri: https://appleid.apple.com/auth/token
          user-info-uri: https://appleid.apple.com/auth/userinfo
          user-name-attribute: email
        facebook:
          authorization-uri: https://www.facebook.com/v18.0/dialog/oauth
          token-uri: https://graph.facebook.com/v18.0/oauth/access_token
          user-info-uri: https://graph.facebook.com/me?fields=id,name,email,first_name,last_name
          user-name-attribute: id


reliability:
  rate-limiting:
    enabled: true
    requests: 120
    auth-requests: ${RATE_LIMIT_AUTH_REQUESTS:20}
    captcha-bypass-token: ${RATE_LIMIT_BYPASS_TOKEN:}
  bookings:
    # An unpaid online booking is cancelled and its slot released after this long.
    pending-payment-expiry-minutes: ${BOOKING_PAYMENT_EXPIRY_MINUTES:30}
    expiry-interval-ms: 60000
    # The spa can check a guest in from this long before the start time.
    arrival-window-minutes: 120
    # Appointments the spa never closed out are marked completed this long after they end. 0 disables.
    auto-complete-after-hours: ${BOOKING_AUTO_COMPLETE_HOURS:24}
    auto-complete-interval-ms: 900000
    # Customers get one reminder this long before a confirmed appointment. 0 disables.
    reminder-lead-hours: ${BOOKING_REMINDER_LEAD_HOURS:24}
    reminder-interval-ms: 300000
  payments:
    reconcile-threshold-minutes: 15
    reconcile-interval-ms: 300000
    per-user-requests: 90
    window-seconds: 60
    block-seconds: 120

loyalty:
  # Share of the amount paid that a customer earns back as points when an appointment is
  # completed. One point is worth one minor currency unit at checkout. 0 disables earning.
  earn-percent: ${LOYALTY_EARN_PERCENT:2}

# Booking SMS to spas, with a private link to confirm or decline. Uses the sms settings above
# (AWS SNS). Indian carriers need a DLT-registered sender and one template per message kind.
spa-alerts:
  enabled: ${SPA_ALERTS_ENABLED:true}
  interval-ms: 120000
  log-messages: false
  sms:
    sender-id: ${SPA_SMS_SENDER_ID:}
    dlt-entity-id: ${SPA_SMS_DLT_ENTITY_ID:}
    templates:
      new: ${SPA_SMS_TEMPLATE_NEW:}
      reminder: ${SPA_SMS_TEMPLATE_REMINDER:}
      cancelled: ${SPA_SMS_TEMPLATE_CANCELLED:}
      moved: ${SPA_SMS_TEMPLATE_MOVED:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  scheduling:
    # Background jobs: payment reconciliation, unpaid-booking expiry, auto-completion.
    enabled: ${SCHEDULING_ENABLED:true}
  flyway:
    # Flyway repair rewrites migration history. Run it deliberately, never on every start.
    repair-on-migrate: ${FLYWAY_REPAIR_ON_MIGRATE:false}
