# Continuous integration. Nothing here deploys: on main the images are only published to GHCR.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests (MariaDB 11.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:11.4.13-noble
        env:
          # Throwaway database that only lives for this job; not a real credential.
          MARIADB_ROOT_PASSWORD: ci-throwaway-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SPA_DB_URL: jdbc:mysql://127.0.0.1:3306/nirvana_ci
      SPA_DB_USER: root
      SPA_DB_PASSWORD: ci-throwaway-root
      SPRING_JPA_DATABASE_PLATFORM: com.nirvana.application.config.LocalMariaDbDialect
    steps:
      - uses: actions/checkout@v4

      - name: Create the test database (migration V57 needs utf8mb4_0900_ai_ci)
        run: |
          docker exec "${{ job.services.mariadb.id }}" mariadb -uroot -p"$SPA_DB_PASSWORD" -e \
            "CREATE DATABASE nirvana_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"

      - name: Generate a JWT secret for this run
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and package
        run: sh ./mvnw -B -ntp clean verify

      - name: Share the verified JAR with native image builds
        uses: actions/upload-artifact@v4
        with:
          name: verified-api
          path: target/application-*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend lint, typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_PUBLIC_SITE_URL: https://nirvana-spa.in
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser

  scripts:
    name: Shell script checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning scripts/*.sh
      - run: for script in scripts/*.sh; do bash -n "$script"; done

  images:
    name: Build and smoke-test (${{ matrix.arch }})
    needs: [backend, frontend, scripts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      ARCH: ${{ matrix.arch }}
      VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-api
          path: .ci-artifacts
      - uses: docker/setup-buildx-action@v3

      - name: Build native app, web and backup images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: |
            app
            web
            backup
          load: true
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.label.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.label.org.opencontainers.image.revision=${{ github.sha }}
            app.args.APP_JAR_SOURCE=verified-jar
            app.cache-from=type=gha,scope=app-${{ matrix.arch }}
            web.cache-from=type=gha,scope=web-${{ matrix.arch }}
            backup.cache-from=type=gha,scope=backup-${{ matrix.arch }}
            app.cache-to=type=gha,mode=max,scope=app-${{ matrix.arch }}
            web.cache-to=type=gha,mode=max,scope=web-${{ matrix.arch }}
            backup.cache-to=type=gha,mode=max,scope=backup-${{ matrix.arch }}
        env:
          # Compose requires these placeholders to parse the file. No runtime secrets enter a build.
          DB_ROOT_PASSWORD: compose-build-only
          DB_APP_PASSWORD: compose-build-only
          JWT_SECRET: compose-build-only-unused-at-runtime

      - name: Exercise the built stack through nginx
        run: bash scripts/smoke-compose.sh

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested native images
        if: env.PUBLISH == 'true'
        run: |
          for target in app web backup; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}/$target:sha-$GITHUB_SHA-$ARCH"
            docker tag "nirvana-$target:local" "$image"
            docker push "$image"
          done

  publish:
    name: Publish and verify multi-platform images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested digests and check both release tags
        run: |
          for target in app web backup; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}/$target"
            release="$image:sha-$GITHUB_SHA"
            docker buildx imagetools create -t "$release" -t "$image:main" \
              "$release-amd64" "$release-arm64"
            docker buildx imagetools inspect --raw "$release" > sha.json
            docker buildx imagetools inspect --raw "$image:main" > main.json
            cmp sha.json main.json
            jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"]' sha.json
          done
