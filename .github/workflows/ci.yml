# Continuous integration. Nothing here deploys: on main the images are only published to GHCR.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests (MariaDB 11.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:11.4.13-noble
        env:
          # Throwaway database that only lives for this job; not a real credential.
          MARIADB_ROOT_PASSWORD: ci-throwaway-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SPA_DB_URL: jdbc:mysql://127.0.0.1:3306/nirvana_ci
      SPA_DB_USER: root
      SPA_DB_PASSWORD: ci-throwaway-root
      SPRING_JPA_DATABASE_PLATFORM: com.nirvana.application.config.LocalMariaDbDialect
    steps:
      - uses: actions/checkout@v4

      - name: Create the test database (migration V57 needs utf8mb4_0900_ai_ci)
        run: |
          docker exec "${{ job.services.mariadb.id }}" mariadb -uroot -p"$SPA_DB_PASSWORD" -e \
            "CREATE DATABASE nirvana_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"

      - name: Generate a JWT secret for this run
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and package
        run: sh ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend lint, typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run

  scripts:
    name: Shell script checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning scripts/*.sh
      - run: bash -n scripts/backup-db.sh scripts/restore-db.sh scripts/backup-schedule.sh

  images:
    name: Docker images
    needs: [backend, frontend, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Only used on main, with the job's own GITHUB_TOKEN; no stored secrets.
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.names.outputs.prefix }}/app:sha-${{ github.sha }}
            ${{ env.PUBLISH == 'true' && format('{0}/app:main', steps.names.outputs.prefix) || '' }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: ${{ env.PUBLISH == 'true' }}
          # Preview build (noindex). Set a repository variable to build for the production origin.
          build-args: |
            VITE_PUBLIC_SITE_URL=${{ vars.VITE_PUBLIC_SITE_URL }}
          tags: |
            ${{ steps.names.outputs.prefix }}/web:sha-${{ github.sha }}
            ${{ env.PUBLISH == 'true' && format('{0}/web:main', steps.names.outputs.prefix) || '' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backup
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.names.outputs.prefix }}/backup:sha-${{ github.sha }}
            ${{ env.PUBLISH == 'true' && format('{0}/backup:main', steps.names.outputs.prefix) || '' }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
