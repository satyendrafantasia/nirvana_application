openapi: 3.0.3
info:
  title: Nirvana SPA Booking API
  version: 0.0.1-SNAPSHOT
  description: API specification for the Nirvana single page application booking backend.
servers:
  - url: http://localhost:8080/api
    description: Local development server
  - url: https://api.nirvana.local/api
    description: Production server (example)
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationDTO'
      responses:
        '200':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and return JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /privacy/consent:
    post:
      tags: [Compliance]
      summary: Update user consent and preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdateRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
  /privacy/erase:
    post:
      tags: [Compliance]
      summary: Request user data erasure
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataErasureRequest'
      responses:
        '200':
          description: User flagged for erasure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
  /bookings:
    post:
      tags: [Bookings]
      summary: Create a booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
      responses:
        '200':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreateResponse'
  /me/bookings:
    get:
      tags: [Bookings]
      summary: List bookings for current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Booking list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
  /bookings/{bookingId}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel a booking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Cancellation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCancelResponse'
  /bookings/{bookingId}/payments/razorpay/order:
    post:
      tags: [Payments]
      summary: Create Razorpay order for a booking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Payment initiation info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInitResponse'
  /bookings/{bookingId}/payments/razorpay/confirm:
    post:
      tags: [Payments]
      summary: Confirm Razorpay payment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RazorpayConfirmRequest'
      responses:
        '200':
          description: Payment confirmed
  /bookings/{bookingId}/payments/razorpay/retry:
    post:
      tags: [Payments]
      summary: Retry Razorpay payment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: New payment order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInitResponse'
  /bookings/{bookingId}/payments/razorpay/payment-link:
    post:
      tags: [Payments]
      summary: Create Razorpay payment link
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Payment link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkInitResponse'
  /payments/razorpay/webhook:
    post:
      tags: [Payments]
      summary: Handle Razorpay webhook callbacks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid signature
  /bookings/{bookingId}/refunds:
    post:
      tags: [Refunds]
      summary: Request a refund for a booking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequestDto'
      responses:
        '200':
          description: Refund request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponseDto'
  /bookings/{bookingId}/refunds/latest:
    get:
      tags: [Refunds]
      summary: Get latest refund for a booking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Latest refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponseDto'
  /bookings/{bookingId}/refunds/approve:
    post:
      tags: [Refunds]
      summary: Approve or process a refund (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefundDecisionRequest'
      responses:
        '200':
          description: Refund decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponseDto'
  /bookings/{bookingId}/vouchers:
    post:
      tags: [Refunds]
      summary: Issue a voucher for a booking (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherIssueRequest'
      responses:
        '200':
          description: Voucher issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherResponse'
  /bookings/{bookingId}/invoice/pdf:
    post:
      tags: [Invoices]
      summary: Generate invoice PDF for booking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Invoice generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseDto'
  /spas:
    post:
      tags: [Spas]
      summary: Create a spa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaRequestDTO'
      responses:
        '200':
          description: Spa created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaResponseDTO'
  /spas/{id}:
    get:
      tags: [Spas]
      summary: Get spa details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Spa details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaDetailResponse'
    put:
      tags: [Spas]
      summary: Update spa
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaRequestDTO'
      responses:
        '200':
          description: Spa updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaResponseDTO'
    delete:
      tags: [Spas]
      summary: Deactivate spa
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Spa deactivated
  /spas/{id}/services:
    get:
      tags: [Spas]
      summary: List services for a spa
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Services for spa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceSummaryResponse'
  /spas/search:
    get:
      tags: [SpaSearch]
      summary: Search spas with filters and pagination
      parameters:
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: countryCode
          schema: { type: string }
        - in: query
          name: locality
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: minRating
          schema: { type: number, format: float }
        - in: query
          name: serviceId
          schema: { type: integer, format: int64 }
        - in: query
          name: serviceName
          schema: { type: string }
        - in: query
          name: serviceCategory
          schema: { type: string }
        - in: query
          name: minLat
          schema: { type: number, format: double }
        - in: query
          name: maxLat
          schema: { type: number, format: double }
        - in: query
          name: minLon
          schema: { type: number, format: double }
        - in: query
          name: maxLon
          schema: { type: number, format: double }
        - in: query
          name: centerLat
          schema: { type: number, format: double }
        - in: query
          name: centerLon
          schema: { type: number, format: double }
        - in: query
          name: radiusKm
          schema: { type: number, format: double }
        - in: query
          name: sort
          schema: { type: string, default: featured }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Paged spa search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSpaSummaryResponse'
  /spas/nearby:
    get:
      tags: [SpaDiscovery]
      summary: List spas near coordinates
      parameters:
        - in: query
          name: lat
          required: true
          schema: { type: number, format: double }
        - in: query
          name: lon
          required: true
          schema: { type: number, format: double }
        - in: query
          name: radiusKm
          schema: { type: number, format: double }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Nearby spas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpaSummaryResponse'
  /spas/recommendations:
    get:
      tags: [SpaDiscovery]
      summary: Recommend spas near coordinates
      parameters:
        - in: query
          name: lat
          required: true
          schema: { type: number, format: double }
        - in: query
          name: lon
          required: true
          schema: { type: number, format: double }
        - in: query
          name: radiusKm
          schema: { type: number, format: double }
        - in: query
          name: minRating
          schema: { type: number, format: float }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 5 }
      responses:
        '200':
          description: Recommended spas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSpaSummaryResponse'
  /spas/{spaId}/services/{serviceId}/slots/week:
    get:
      tags: [Slots]
      summary: Get slot availability for a week
      parameters:
        - in: path
          name: spaId
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: serviceId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: days
          schema: { type: integer, default: 7, minimum: 1, maximum: 14 }
        - in: query
          name: guests
          schema: { type: integer, default: 1, minimum: 1 }
      responses:
        '200':
          description: Week slots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekSlotsResponse'
  /spas/{spaId}/services/{serviceId}/slots:
    get:
      tags: [Slots]
      summary: Get slot availability for a day
      parameters:
        - in: path
          name: spaId
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: serviceId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
        - in: query
          name: guests
          schema: { type: integer, default: 1, minimum: 1 }
      responses:
        '200':
          description: Slots for date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotAvailabilityResponse'
  /maps/route:
    get:
      tags: [Maps]
      summary: Estimate route between coordinates
      parameters:
        - in: query
          name: originLat
          required: true
          schema: { type: number, format: double }
        - in: query
          name: originLon
          required: true
          schema: { type: number, format: double }
        - in: query
          name: destinationLat
          required: true
          schema: { type: number, format: double }
        - in: query
          name: destinationLon
          required: true
          schema: { type: number, format: double }
        - in: query
          name: mode
          schema: { type: string, default: driving }
      responses:
        '200':
          description: Route estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapRouteResponse'
  /maps/eta/spa/{spaId}:
    get:
      tags: [Maps]
      summary: Estimate route to spa from origin
      parameters:
        - in: path
          name: spaId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: originLat
          required: true
          schema: { type: number, format: double }
        - in: query
          name: originLon
          required: true
          schema: { type: number, format: double }
        - in: query
          name: mode
          schema: { type: string, default: driving }
      responses:
        '200':
          description: Route estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapRouteResponse'
  /maps/provider:
    get:
      tags: [Maps]
      summary: Get active map provider configuration
      responses:
        '200':
          description: Provider config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapProviderConfigResponse'
  /messages/threads:
    post:
      tags: [Messaging]
      summary: Start a messaging thread
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageThreadCreateRequest'
      responses:
        '200':
          description: Thread created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageThreadResponse'
    get:
      tags: [Messaging]
      summary: List message threads for current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageThreadListResponse'
  /messages/threads/{threadId}/messages:
    get:
      tags: [Messaging]
      summary: List chat messages in a thread
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: threadId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageListResponse'
    post:
      tags: [Messaging]
      summary: Post a chat message to a thread
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: threadId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '200':
          description: Created message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
  /messages/messages/{messageId}/moderate:
    post:
      tags: [Messaging]
      summary: Moderate a chat message (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: messageId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationDecisionRequest'
      responses:
        '200':
          description: Moderation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
  /notifications/send:
    post:
      tags: [Notifications]
      summary: Send a notification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSendRequest'
      responses:
        '200':
          description: Notification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
  /notifications/me:
    get:
      tags: [Notifications]
      summary: List notifications for current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
  /notifications/templates:
    post:
      tags: [Notifications]
      summary: Create or update a notification template (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTemplateRequest'
      responses:
        '200':
          description: Saved template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplateResponse'
    get:
      tags: [Notifications]
      summary: List notification templates (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationTemplateResponse'
  /faqs:
    get:
      tags: [Content]
      summary: List FAQs
      parameters:
        - in: query
          name: category
          schema: { type: string }
      responses:
        '200':
          description: FAQ list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqListResponse'
    post:
      tags: [Content]
      summary: Create a FAQ entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaqRequest'
      responses:
        '200':
          description: Created FAQ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqResponse'
  /content-variants:
    get:
      tags: [Content]
      summary: List active content variants
      parameters:
        - in: query
          name: experimentKey
          schema: { type: string }
        - in: query
          name: locale
          schema: { type: string }
      responses:
        '200':
          description: Content variants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentVariantListResponse'
    post:
      tags: [Content]
      summary: Create a content variant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentVariantRequest'
      responses:
        '200':
          description: Created variant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentVariantResponse'
  /reviews:
    post:
      tags: [Reviews]
      summary: Submit a review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
  /spas/{spaId}/reviews:
    get:
      tags: [Reviews]
      summary: List reviews for a spa
      parameters:
        - in: path
          name: spaId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
