components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        token:
          type: string
        tokenType:
          type: string
          default: Bearer
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          maxLength: 20
    UserRegistrationDTO:
      type: object
      required: [username, password, name, lastName]
      properties:
        username:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          maxLength: 20
        name:
          type: string
        lastName:
          type: string
        roleType:
          $ref: '#/components/schemas/RoleType'
        marketingOptIn:
          type: boolean
          default: true
        acceptPrivacyPolicy:
          type: boolean
          default: false
        consentVersion:
          type: string
          default: v1
        consentSource:
          type: string
          default: registration
        timezone:
          type: string
          default: UTC
        locale:
          type: string
          default: en
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        marketingOptIn:
          type: boolean
        acceptPrivacyPolicy:
          type: boolean
        consentVersion:
          type: string
        consentSource:
          type: string
        timezone:
          type: string
        locale:
          type: string
    ConsentUpdateRequest:
      type: object
      required: [consentVersion]
      properties:
        marketingOptIn:
          type: boolean
        acceptPrivacyPolicy:
          type: boolean
        consentVersion:
          type: string
          maxLength: 64
        consentSource:
          type: string
          maxLength: 128
        timezone:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 16
    DataErasureRequest:
      type: object
      required: [reason, confirmationKeyword]
      properties:
        reason:
          type: string
          maxLength: 256
        confirmationKeyword:
          type: string
          maxLength: 16
    BookingCreateRequest:
      type: object
      required: [spaId, serviceId, slotId, guests, paymentMode]
      properties:
        spaId:
          type: integer
          format: int64
        serviceId:
          type: integer
          format: int64
        slotId:
          type: integer
          format: int64
        guests:
          type: integer
          minimum: 1
        paymentMode:
          type: string
          description: ONLINE or OFFLINE
        specialRequest:
          type: string
          maxLength: 2000
        couponCode:
          type: string
          maxLength: 64
        redeemLoyaltyPoints:
          type: boolean
    BookingCreateResponse:
      type: object
      properties:
        booking:
          $ref: '#/components/schemas/BookingResponse'
    BookingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/BookingStatus'
        spaId:
          type: integer
          format: int64
        serviceId:
          type: integer
          format: int64
        slotId:
          type: integer
          format: int64
        guests:
          type: integer
        amount:
          type: number
          format: double
        currency:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    BookingListResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BookingResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
    BookingCancelResponse:
      type: object
      properties:
        bookingId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/BookingStatus'
        refundInitiated:
          type: boolean
    PaymentInitResponse:
      type: object
      properties:
        orderId:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        keyId:
          type: string
    PaymentLinkInitResponse:
      type: object
      properties:
        paymentLinkId:
          type: string
        paymentLinkUrl:
          type: string
    RazorpayConfirmRequest:
      type: object
      required: [paymentId, orderId, signature]
