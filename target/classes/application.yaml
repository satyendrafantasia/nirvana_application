
  spring:
    application:
      name: application
    profiles:
      active: local

    datasource:
      url: jdbc:mysql://localhost:3306/nirvana_v1?useSSL=false&serverTimezone=UTC
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        minimum-idle: 2
        maximum-pool-size: 10

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true



    servlet:
      multipart:
        max-file-size: 50MB
        max-request-size: 50MB

  server:
    port: 8080
    servlet:
      context-path: /api
    compression:
      enabled: true
      mime-types: application/json,application/xml,text/html,text/xml,text/plain
      min-response-size: 1024

  logging:
    level:
      root: INFO
      com.yourcompany: DEBUG

  management:
    endpoints:
      web:
        exposure:
          include:
            - health
            - info
            - metrics
            - prometheus
        base-path: /management
    endpoint:
      health:
        show-details: when-authorized

  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html



  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  multipart:
    max-file-size: 10MB
    max-request-size: 20MB


  aws:
    s3:
      bucket-name: your-bucket-name
    region: us-east-1
    access-key-id: YOUR_ACCESS_KEY_ID
    secret-key: YOUR_SECRET_KEY



  flyway:
    enabled: true
    locations: "classpath:db/migration"




